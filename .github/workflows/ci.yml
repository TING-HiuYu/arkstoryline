name: PRTS Metadata Sync

on:
  schedule:
    - cron: '0 18 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prts-metadata-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install rich

      - name: Sync PRTS metadata
        run: |
          python3 -m scripts.resourcesFetcher sync-storyline-index
          python3 -m scripts.resourcesFetcher sync-operator-index
          python3 -m scripts.resourcesFetcher sync-terra-historicus-index
          python3 -m scripts.resourcesFetcher sync-story-content-sources

      - name: Commit metadata changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "No metadata changes to commit."
          else
            git commit -m "chore(data): sync PRTS metadata"
            git push
          fi
